line-length = 100

[lint]
select = ["ALL"]
ignore = [
  "D1",      # docstrings are allowed, not required
  "D203",    # conflicts with D211
  "D213",    # conflicts with D212
  "COM812",  # conflicts with the formatter
  "CPY",     # no license headers required
]

[lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "INP001", "S603"]
"**/test_*.py" = ["S101", "PLR2004"]

[lint.mccabe]
max-complexity = 15

[lint.pylint]
max-args = 5
max-nested-blocks = 3
